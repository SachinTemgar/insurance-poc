<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Insurance Products</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">

    <h1>Insurance Products</h1>
    <p class="subtitle">Available policies from our catalogue</p>

    <form action="products" method="get">
        <button type="submit">Load Products</button>
    </form>

    <table>
        <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Description</th>
            <th>Premium</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Term Life</td>
            <td>Fixed-term life cover</td>
            <td class="premium">450.00</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Health Shield</td>
            <td>Individual health cover</td>
            <td class="premium">780.00</td>
        </tr>
    </table>

</div>
</body>
</html>
